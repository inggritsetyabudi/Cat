name: Windows PTY integration
on:
  pull_request:
permissions:
  contents: read
jobs:
  windows-pty-on-driver-candidate:
    name: Windows full suite (PTY, exact PR head)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Configure line endings
        shell: pwsh
        run: git config --global core.autocrlf input
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            diffutils
            python
            git
      - name: Verify compiler and terminal-test provenance
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          printf 'Compiler and PTY snapshot: '; git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          uname -a
          pacman -Q msys2-runtime python
          clang++ --version
      - name: Configure and build exact-head compiler
        run: |
          cmake -S claw -B claw/build-pty-integration -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
          cmake --build claw/build-pty-integration --target claw --parallel 4
      - name: Run complete fail-fast suite including terminal contracts
        run: |
          export CLAW_EXE="$PWD/claw/build-pty-integration/claw.exe"
          bash claw/tests/run_all_tests.sh
