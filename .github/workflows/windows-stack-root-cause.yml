name: Windows stack root cause (diagnostic only)
on:
  push:
    branches: [diag/windows-stack-root-cause-20261020]
permissions:
  contents: read
  actions: read
jobs:
  firstchance-original:
    name: First-chance evidence (worker ${{ matrix.worker }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        worker: [a, b]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Download immutable attempt-1 artifact by ID, not latest run attempt
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          gh api repos/inggritsetyabudi/Cat/actions/artifacts/12238612261/zip > original.zip
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download immutable attempt-1 artifact' }
          $zipHash = (Get-FileHash original.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne '1e3ca92e235812654583885841a688a6bdf81512eae9ef0f12ef7aeae7e2bc8c') { throw "Archive hash mismatch: $zipHash" }
          Expand-Archive original.zip original
          Get-ChildItem original -Recurse -File | Get-FileHash -Algorithm SHA256 | Format-List | Out-File evidence/original-hashes.txt
          Copy-Item original/windows-stack-diagnostic.json evidence/attempt-1-diagnostic-FAILED.json
          Copy-Item original.zip evidence/attempt-1-original.zip
          $info = [ordered]@{
            computer = $env:COMPUTERNAME; runnerName = $env:RUNNER_NAME
            imageOS = $env:ImageOS; imageVersion = $env:ImageVersion
            architecture = $env:PROCESSOR_ARCHITECTURE; processors = $env:NUMBER_OF_PROCESSORS
            cwd = (Get-Location).Path; os = [System.Environment]::OSVersion.VersionString
            path = $env:PATH; systemRoot = $env:SystemRoot
          }
          $info | ConvertTo-Json | Out-File evidence/worker-environment.json
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,OSArchitecture,LastBootUpTime | ConvertTo-Json | Out-File evidence/os.json
          foreach ($dll in @('ntdll.dll','kernel32.dll','KernelBase.dll','ucrtbase.dll','msvcrt.dll')) {
            $file = Get-Item "$env:SystemRoot/System32/$dll"
            [pscustomobject]@{path=$file.FullName; version=$file.VersionInfo.FileVersion; sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash} | ConvertTo-Json -Compress | Add-Content evidence/system-modules.jsonl
          }
          Get-ProcessMitigation -System | Out-File evidence/system-mitigations.txt
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-binutils
            python
      - name: Capture first and second chance, stack reservation and unrelated-AV negatives
        shell: msys2 {0}
        run: |
          set -euo pipefail
          clang --version | tee evidence/clang-version.txt
          uname -a | tee evidence/msys-version.txt
          clang -std=c11 -Wall -Wextra -municode "$(cygpath -w tools/windows_stack_debug.c)" -o evidence/debug.exe
          printf '#include <windows.h>\nint main(void) { void *p=VirtualAlloc(0,4096,MEM_RESERVE|MEM_COMMIT,PAGE_NOACCESS); if(!p)return 2; *(volatile int *)p=1; return 0; }\n' > evidence/unrelated-av.c
          printf '#include <windows.h>\nint main(void) { RaiseException(0xC00000FD,0,0,0); return 0; }\n' > evidence/synthetic-so.c
          clang -O0 evidence/unrelated-av.c -o evidence/unrelated-av.exe
          clang -O0 evidence/synthetic-so.c -o evidence/synthetic-so.exe
          for variant in baseline fixed; do
            for opt in O0 O2; do
              objdump -d "original/$variant/$variant-$opt.exe" > "evidence/$variant-$opt-disassembly.txt"
              objdump -p "original/$variant/$variant-$opt.exe" > "evidence/$variant-$opt-pe.txt"
            done
          done
          python3 tools/windows_stack_firstchance.py
          objdump -p /c/Windows/System32/ntdll.dll > evidence/ntdll-pe-exports.txt
          objdump -d /c/Windows/System32/ntdll.dll > evidence/ntdll-disassembly.txt
          objdump -p /c/Windows/System32/KernelBase.dll > evidence/kernelbase-pe-exports.txt
          objdump -d /c/Windows/System32/KernelBase.dll > evidence/kernelbase-disassembly.txt
      - name: Independent PowerShell native statuses
        if: always()
        shell: pwsh
        run: |
          foreach ($variant in @('baseline', 'fixed')) {
            foreach ($opt in @('O0','O2')) {
              $path = (Resolve-Path "original/$variant/$variant-$opt.exe").Path
              $p = Start-Process -FilePath $path -Wait -PassThru -NoNewWindow -RedirectStandardOutput "evidence/$variant-$opt-pwsh.stdout" -RedirectStandardError "evidence/$variant-$opt-pwsh.stderr"
              "$variant/$opt signed=$($p.ExitCode) hex=$('{0:X8}' -f $p.ExitCode)" | Tee-Object -Append evidence/pwsh-status.txt
            }
          }
      - name: Upload evidence, not production-readiness approval
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-stack-firstchance-${{ matrix.worker }}
          path: evidence
          if-no-files-found: error
