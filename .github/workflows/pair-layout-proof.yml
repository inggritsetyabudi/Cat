name: Pair layout proof (TEST ONLY)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Pair layout (native Linux, LLVM 23.1.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang cmake ninja-build python3-zstandard libxml2-dev zlib1g-dev libzstd-dev
      - name: Fetch exact checksum-pinned SDK
        run: |
          mkdir -p ci-evidence
          /usr/bin/python3 claw/experimental/llvm_cpp/fetch_sdk.py --destination "$RUNNER_TEMP/llvm23-sdk" | tee ci-evidence/sdk-fetch.json
          "$RUNNER_TEMP/llvm23-sdk/bin/llvm-config" --version --host-target | tee ci-evidence/sdk-version.txt
      - name: Build only pair probe and production compiler
        run: |
          set -euo pipefail
          cmake -S tools/pair_layout -B build-pair -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCLAW_LLVM_CONFIG="$RUNNER_TEMP/llvm23-sdk/bin/llvm-config" 2>&1 | tee ci-evidence/configure.log
          cmake --build build-pair --target claw-pair-layout-probe claw --parallel 2 --verbose 2>&1 | tee ci-evidence/build.log
      - name: Compare observable pair layouts on exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/pair_layout/run.py --compiler build-pair/claw/claw --probe build-pair/claw-pair-layout-probe --clang clang --expected-head "$EXPECTED_HEAD" --artifacts ci-evidence/pair 2>&1 | tee ci-evidence/probe.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pair-layout-native-linux
          path: ci-evidence/
          if-no-files-found: error

  windows:
    name: Pair layout (native Windows UCRT, LLVM 23.1.3)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            git
      - name: Install exact checksum-pinned native SDK
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          pkg=mingw-w64-ucrt-x86_64-llvm-23.1.3-1-any.pkg.tar.zst
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/$pkg" "https://repo.msys2.org/mingw/ucrt64/$pkg"
          printf '%s  %s\n' d23bf19409cbafe837b9ef04b29943e81955eda2842e866ac0c77ef3126be569 "$RUNNER_TEMP/$pkg" | sha256sum -c - | tee ci-evidence/sdk-checksum.txt
          pacman -U --noconfirm "$RUNNER_TEMP/$pkg"
          test "$(/ucrt64/bin/llvm-config.exe --version)" = 23.1.3
          /ucrt64/bin/llvm-config.exe --version --host-target | tee ci-evidence/sdk-version.txt
          pacman -Q > ci-evidence/packages.txt
      - name: Build only pair probe and production compiler
        run: |
          set -euo pipefail
          cmake -S tools/pair_layout -B build-pair -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=/ucrt64/bin/clang++.exe -DCLAW_LLVM_CONFIG=/ucrt64/bin/llvm-config.exe 2>&1 | tee ci-evidence/configure.log
          cmake --build build-pair --target claw-pair-layout-probe claw --parallel 2 --verbose 2>&1 | tee ci-evidence/build.log
      - name: Compare observable pair layouts on exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          /ucrt64/bin/python.exe tools/pair_layout/run.py --compiler build-pair/claw/claw.exe --probe build-pair/claw-pair-layout-probe.exe --clang /ucrt64/bin/clang.exe --expected-head "$EXPECTED_HEAD" --artifacts ci-evidence/pair 2>&1 | tee ci-evidence/probe.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pair-layout-native-windows-ucrt
          path: ci-evidence/
          if-no-files-found: error
